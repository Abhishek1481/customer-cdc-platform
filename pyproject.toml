[project]
name = "customer-cdc"
version = "0.1.0"
description = "PostgreSQL -> Debezium -> Kafka -> Snowflake CDC pipeline with SCD Type 2 history"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "confluent-kafka>=2.6",
    "duckdb>=1.2",
    "psycopg[binary]>=3.2",
    "requests>=2.32",
    "tenacity>=9.0",
    "faker>=30.0",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.12"]

[project.scripts]
cdc-consumer = "customer_cdc.consumer.main:main"
cdc-replay = "customer_cdc.consumer.replay:main"
cdc-warehouse = "customer_cdc.transformations.cli:main"
cdc-workload = "customer_cdc.producer.workload:main"
cdc-bootstrap = "customer_cdc.utils.bootstrap:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_cdc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs live services (PostgreSQL / Kafka); skipped unless the matching env var is set",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "S", "PTH"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]
